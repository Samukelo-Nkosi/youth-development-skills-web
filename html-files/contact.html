<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Youth Skills Development - Contact</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Youth Skills Development</h1>
        <nav>
            <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="navMenu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <ul id="navMenu">
                <li><a href="index.html">Home</a></li>
                <li><a href="programs.html">Programs</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="about.html">About</a></li>
            </ul>
        </nav>
    </header>

    <section id="contact">
        <h2>Contact Us</h2>
        <p>Interested in joining or supporting our programs? Get in touch!</p>

        <form
            id="contactForm"
            name="contact"
            method="POST"
            data-netlify="true"
            netlify-honeypot="bot-field"
            novalidate
        >
            <!-- Required so Netlify can identify the form at build time -->
            <input type="hidden" name="form-name" value="contact">

            <!-- Honeypot field: hidden from real users, catches spam bots -->
            <p class="hidden-field">
                <label>Don't fill this out if you're human: <input name="bot-field"></label>
            </p>

            <div class="form-group">
                <label for="name" class="visually-hidden">Your Name</label>
                <input type="text" id="name" name="name" placeholder="Your Name" required>
                <span class="error-message" id="nameError"></span>
            </div>

            <div class="form-group">
                <label for="program" class="visually-hidden">Your Program</label>
                <input type="text" id="program" name="program" placeholder="Your Program" required>
                <span class="error-message" id="programError"></span>
            </div>

            <div class="form-group">
                <label for="email" class="visually-hidden">Your Email</label>
                <input type="email" id="email" name="email" placeholder="Your Email" required>
                <span class="error-message" id="emailError"></span>
            </div>

            <div class="form-group">
                <label for="message" class="visually-hidden">Your Message</label>
                <textarea id="message" name="message" placeholder="Your Message" rows="5" required></textarea>
                <span class="error-message" id="messageError"></span>
            </div>

            <button type="submit" id="submitBtn">
                <span class="btn-text">Send Message</span>
                <span class="btn-spinner" aria-hidden="true"></span>
            </button>

            <div id="formStatus" class="form-status" role="status" aria-live="polite"></div>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Youth Skills Development Initiative. All rights reserved.</p>
    </footer>
    <button id="backToTop" aria-label="Back to top">&uarr;</button>

    <script src="js/script.js"></script>
    <script src="js/validation.js"></script>
    <script src="js/contact.js"></script>
</body>
</html>
