# Netlify configuration for Youth Skills Development Initiative
#
# Enables Netlify's built-in Post Processing: automatic minification
# of HTML, CSS, and JS, plus image compression, on every deploy.
# No build step or extra dependencies required.

[build]
  publish = "."

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

[build.processing.images]
  compress = true

# Long cache lifetime for versioned static assets (safe since filenames
# don't change unless content does — Netlify handles cache invalidation)
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Security headers, applied to every response
[[headers]]
  for = "/*"
  [headers.values]
    # Force HTTPS on every future visit for a year, including subdomains
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Stop this site being embedded in an iframe elsewhere (clickjacking protection)
    X-Frame-Options = "DENY"
    # Stop the browser guessing content types (mitigates some injection attacks)
    X-Content-Type-Options = "nosniff"
    # Only send the origin (not the full URL) as a referrer to other sites
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Disable browser features this site doesn't use
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    # Content Security Policy — only allow the resources this site actually uses:
    # same-origin scripts/styles, Unsplash images, and the Google Maps embed.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://cdnjs.cloudflare.com; font-src 'self' https://cdnjs.cloudflare.com; img-src 'self' https://images.unsplash.com data:; frame-src https://www.google.com; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'"